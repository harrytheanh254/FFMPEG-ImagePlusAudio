name: Ghep Anh Va Audio Thành Video MP4

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Tên file ảnh/video nền (VD: anh.jpg)'
        required: true
        default: 'anh.jpg'
      audio_name:
        description: 'Tên file âm thanh (VD: voice.mp3)'
        required: true
        default: 'voice.mp3'

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn từ Repo
        uses: actions/checkout@v4

      - name: Cài đặt FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Ghép Ảnh + Audio thành Video
        run: |
          IMAGE="${{ github.event.inputs.image_name }}"
          AUDIO="${{ github.event.inputs.audio_name }}"
          
          if [[ "$IMAGE" =~ \.(jpg|jpeg|png|webp)$ ]]; then
            ffmpeg -loop 1 -i "$IMAGE" -i "$AUDIO" -c:v libx264 -tune stillimage -c:a aac -b:a 192k -pix_fmt yuv420p -shortest output_video.mp4 -y
          else
            ffmpeg -stream_loop -1 -i "$IMAGE" -i "$AUDIO" -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest output_video.mp4 -y
          fi

      - name: Xuất file Video thành phẩm
        uses: actions/upload-artifact@v4
        with:
          name: file-video-da-ghep
          path: output_video.mp4

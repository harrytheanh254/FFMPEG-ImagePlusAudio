name: Ghep Anh Va Audio Thanh Video Auto

on:
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon Repo
        uses: actions/checkout@v4

      - name: Cai dat ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Tu dong tim file va Ghep video
        run: |
          # 1. Tự động tìm file ảnh đầu tiên (jpg, jpeg, png)
          IMAGE=$(find . -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | head -n 1)
          
          # 2. Tự động tìm file audio đầu tiên (mp3, wav, m4a, aac)
          AUDIO=$(find . -maxdepth 1 -type f \( -iname "*.mp3" -o -iname "*.wav" -o -iname "*.m4a" -o -iname "*.aac" \) | head -n 1)

          echo "File anh tim thay: $IMAGE"
          echo "File audio tim thay: $AUDIO"

          if [ -z "$IMAGE" ] || [ -z "$AUDIO" ]; then
            echo "Loi: Khong tim thấy file anh va/hoac audio trong Repo!"
            exit 1
          fi

          # 3. Ghép thành video
          ffmpeg -loop 1 -i "$IMAGE" -i "$AUDIO" -c:v libx264 -tune stillimage -c:a aac -b:a 192k -pix_fmt yuv420p -shortest output_video.mp4 -y

      - name: Tai video thanh pham ve máy
        uses: actions/upload-artifact@v4
        with:
          name: video-thanh-pham
          path: output_video.mp4
